apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-nginx
  namespace: parcial-ap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-nginx
  namespace: parcial-ap
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ingress-nginx
  namespace: parcial-ap
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`web1.allan.com`)
    kind: Rule
    services:
    - name: svc-nginx
      port: 80