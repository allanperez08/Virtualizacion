apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-deploy
  namespace: parcial-aepa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-apache
  template:
    metadata:
      labels:
        app: web-apache
    spec:
      containers:
      - name: apache
        image: httpd:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: apache-svc
  namespace: parcial-aepa
spec:
  selector:
    app: web-apache
  ports:
  - port: 80
    targetPort: 80