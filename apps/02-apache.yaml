apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-apache
  namespace: parcial-ap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
      - name: httpd
        image: httpd:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-apache
  namespace: parcial-ap
spec:
  selector:
    app: apache
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ingress-apache
  namespace: parcial-ap
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`web2.allan.com`)
    kind: Rule
    services:
    - name: svc-apache
      port: 80