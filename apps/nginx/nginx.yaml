apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy
  namespace: parcial-aepa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-nginx
  template:
    metadata:
      labels:
        app: web-nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.24
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: parcial-aepa
spec:
  selector:
    app: web-nginx
  ports:
  - port: 80
    targetPort: 80