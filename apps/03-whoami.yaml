apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-whoami
  namespace: parcial-ap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
      - name: whoami
        image: containous/whoami
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: svc-whoami
  namespace: parcial-ap
spec:
  selector:
    app: whoami
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: traefik.containo.us/v1alpha1
kind: IngressRoute
metadata:
  name: ingress-whoami
  namespace: parcial-ap
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`web3.allan.com`)
    kind: Rule
    services:
    - name: svc-whoami
      port: 80