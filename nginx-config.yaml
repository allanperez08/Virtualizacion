apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-allan
  labels:
    app: servidor-web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: servidor-web
  template:
    metadata:
      labels:
        app: servidor-web
    spec:
      containers:
      - name: nginx-container
        image: nginx:1.14.2
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-local
spec:
  type: NodePort
  selector:
    app: servidor-web
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080